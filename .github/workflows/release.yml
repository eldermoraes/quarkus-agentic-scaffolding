name: release
# Publishes a GitHub release when a v* tag is pushed, with the matching CHANGELOG
# section as the notes. Tagging is the whole release ritual:
#
#   git tag -a v0.16.0 -m v0.16.0 && git push origin v0.16.0
#
# The job refuses to publish unless the tag, the versioned files, and the
# changelog all agree — a tag pushed at the wrong commit fails loudly instead of
# producing a release whose notes describe something else.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The versioned files agree with each other
        run: ci/check-version-consistency.sh

      - name: ...and with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version=${TAG#v}
          file_version=$(ci/check-version-consistency.sh | awk '{print $3}')
          if [ "$tag_version" != "$file_version" ]; then
            echo "Tag $TAG points at a commit whose files say $file_version." >&2
            echo "Tag the commit that carries the version, or fix the files." >&2
            exit 1
          fi
          echo "OK: tag $TAG matches the files"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fails when the version has no changelog section, so a release is never
          # published with empty or borrowed notes.
          notes=$(ci/extract-changelog.sh "$TAG")
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its notes"
            gh release edit "$TAG" --repo "$REPO" --notes "$notes"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" \
              --verify-tag --notes "$notes"
          fi

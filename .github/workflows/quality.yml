name: quality
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ci/check-version-consistency.sh

  mcp-command-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ci/check-mcp-command-consistency.sh

  conventions-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ci/check-conventions-parity.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck scripts/*.sh ci/*.sh

  behavior-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ci/test-uninstall-bob-skill.sh
      - run: ci/test-conventions-block-removal.sh
      - run: python3 -m unittest discover -s ci -p 'test_*.py'

  mcp-java-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned JBang
        run: |
          curl -fsSL --retry 3 https://github.com/jbangdev/jbang/releases/download/v0.138.0/jbang-0.138.0.tar -o "$RUNNER_TEMP/jbang.tar"
          echo "2b83d1322215b597a1a3e9918d8052737f579d70b9f342521be52c9e3013fd0e  $RUNNER_TEMP/jbang.tar" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/jbang"
          tar -xf "$RUNNER_TEMP/jbang.tar" -C "$RUNNER_TEMP/jbang" --strip-components=1
          echo "$RUNNER_TEMP/jbang/bin" >> "$GITHUB_PATH"
      - run: python3 ci/check_mcp_java_floor.py

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: '**/*.md'
